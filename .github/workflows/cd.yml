name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: integrated-infrastructure-delivery
  EKS_CLUSTER: integrated-delivery-cluster
  KUBERNETES_NAMESPACE: integrated-delivery
  KUBERNETES_DEPLOYMENT: system-health-api
  KUBERNETES_SERVICE: system-health-api

jobs:
  build_and_push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.deploy_sha.outputs.value }}
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Select deployment commit
        id: deploy_sha
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            deploy_sha="${WORKFLOW_RUN_SHA}"
          else
            deploy_sha="${WORKFLOW_DISPATCH_SHA}"
          fi
          echo "value=${deploy_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out deployment commit
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ steps.deploy_sha.outputs.value }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: integrated-delivery
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Set image URI
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DEPLOY_SHA: ${{ steps.deploy_sha.outputs.value }}
        run: echo "uri=${REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.uri }}

  deploy:
    needs:
      - build_and_push
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ needs.build_and_push.outputs.deploy_sha }}
      IMAGE_URI: ${{ needs.build_and_push.outputs.image_uri }}
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: integrated-delivery
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.0.0
        with:
          version: "v1.36.0"

      - name: Configure Kubernetes access
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER}"

      - name: Render versioned Kubernetes resources
        run: |
          kubectl kustomize Kubernetes > rendered.yaml
          sed --in-place "s|image: system-health-api:0.1.0|image: ${IMAGE_URI}|g" rendered.yaml
          sed --in-place "s|value: 0.1.0|value: ${DEPLOY_SHA}|g" rendered.yaml
          grep --fixed-strings --quiet "image: ${IMAGE_URI}" rendered.yaml
          grep --fixed-strings --quiet "value: ${DEPLOY_SHA}" rendered.yaml
          if grep --fixed-strings --quiet "image: system-health-api:0.1.0" rendered.yaml; then
            exit 1
          fi

      - name: Apply Kubernetes resources
        run: kubectl apply --filename rendered.yaml

      - name: Wait for deployment
        run: kubectl --namespace "${KUBERNETES_NAMESPACE}" rollout status deployment/"${KUBERNETES_DEPLOYMENT}" --timeout=10m

      - name: Wait for load balancer
        id: endpoint
        run: |
          load_balancer=""
          for attempt in $(seq 1 60); do
            load_balancer=$(kubectl --namespace "${KUBERNETES_NAMESPACE}" get service "${KUBERNETES_SERVICE}" --output jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "${load_balancer}" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "${load_balancer}" ]; then
            kubectl --namespace "${KUBERNETES_NAMESPACE}" describe service "${KUBERNETES_SERVICE}"
            exit 1
          fi
          echo "url=http://${load_balancer}" >> "${GITHUB_OUTPUT}"

      - name: Verify deployed endpoints
        env:
          APPLICATION_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${APPLICATION_URL}/health" | grep --quiet '"status":"healthy"'; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "${APPLICATION_URL}/" | grep --quiet '"application":"System Health API"'
          curl --fail --silent --show-error "${APPLICATION_URL}/system" | grep --quiet '"uptime_seconds":'
          curl --fail --silent --show-error "${APPLICATION_URL}/version" | grep --quiet "\"version\":\"${DEPLOY_SHA}\""
