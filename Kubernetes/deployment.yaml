apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-health-api
  namespace: integrated-delivery
  labels:
    app.kubernetes.io/name: system-health-api
    app.kubernetes.io/part-of: integrated-infrastructure-delivery
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: system-health-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: system-health-api
        app.kubernetes.io/part-of: integrated-infrastructure-delivery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: system-health-api
          image: system-health-api:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: 0.1.0
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
